        <h2>天候：永遠要有 Plan B</h2>
        <p>小雨、風切、氣溫驟降都會改寫流程。室內場地較可控；戶外則要把「移動到遮蔽處」的時間算進去。</p>
        <h2>服務與清潔</h2>
        <p>戶外垃圾與廚餘更要即時處理，避免引來蟲類與動物。對團體來說，分工表比口頭提醒有效。</p>
        <h2>氛圍：戶外更吃「留白」</h2>
        <p>室內可以用裝潢撑場；戶外反而要靠<strong>節奏與光線</strong>。這也是為什麼森林系場地特別適合小型、長時段的聚會。</p>
