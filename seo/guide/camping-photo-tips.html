        <h2>時間：日出後與日落前</h2>
        <p>柔和斜光能讓皮膚與草地都更好看。正中午容易陰影過硬，可改拍樹蔭下或帳篷內。</p>
        <h2>構圖：把「露營正在發生」拍進去</h2>
        <p>煮水、切水果、拉椅子、掛燈串，這些動作比硬站著更有故事。人物在畫面邊三分之一也常更自然。</p>
        <h2>夜拍：穩定與光源</h2>
        <p>夜間提高 ISO 容易雜訊，可找既有暖光環境，或讓臉部靠近桌燈，避免只剩燈串點點。</p>
