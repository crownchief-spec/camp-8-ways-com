        <h2>我該什麼時候確認天氣？</h2>
        <p>出發前與抵達當日都再看一次；山區微氣候變化快，預留雨備與保暖。</p>
        <h2>噪音與燈光</h2>
        <p>戶外空間聲音傳得遠，請把音量控制在「同桌可聽見」。燈光亦避免直射鄰近營位。</p>
