        <h2>把「補給」一次做好</h2>
        <p>出發前把飲水、冰桶與孩子零食補齊，現場就更少奔波。實際店家與路線請依當下導航為準。</p>
        <h2>露營那晚，讓手機休息</h2>
        <p>不一定要完全斷線，但至少留一段時間不看工作訊息；夜晚留給抬頭、聊天與慢慢吃。</p>
