        <h2>燈光：低位、分散、暖色</h2>
        <p>避免一盞超亮投射把全場打得像球場。桌燈、燈串、地燈分散光源，眼睛舒服，氣氛也會更溫柔。</p>
        <h2>座位：圍得起來</h2>
        <p>圍圈或長桌都可以，重點是讓大家<strong>看得到彼此臉</strong>，聊天才會自然延續。</p>
        <h2>音量：把安靜留一點給森林</h2>
        <p>音樂可有可無；若要播放，請控制在同桌可聽見的範圍。實際規範請遵循營區公告。</p>
